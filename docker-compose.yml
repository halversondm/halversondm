services:
  localstack:
    image: localstack/localstack:4
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,secretsmanager
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -sf http://localhost:4566/_localstack/init/READY | grep -q ''"completed": true''',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: halversondm:latest
    ports:
      - "4001:3000"
    environment:
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_ENDPOINT_URL_DYNAMODB=http://localstack:4566
      - AWS_ENDPOINT_URL_SECRETS_MANAGER=http://localstack:4566
      - ABC_TABLE=ABC
    depends_on:
      localstack:
        condition: service_healthy
