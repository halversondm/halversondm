name: CD
on:
  push:
    branches-ignore:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      - name: Install Dependencies
        run: npm ci

      - name: Check Formatting
        run: npm run prettier:check

      - name: Lint Code
        run: npm run lint

      - name: Build Code
        run: npm run build

      - name: Run Tests with Coverage
        run: |
          npm run test:run --workspace=apps/web -- --coverage --coverage.reporter=lcov
          sed -i 's#^SF:#SF:apps/web/#' apps/web/coverage/lcov.info

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8.4.1
